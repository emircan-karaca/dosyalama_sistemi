name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Söz dizimi kontrolü
        run: python -m compileall -q app alembic

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
        env:
          BACKEND_URL: http://backend:8000

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .env oluştur
        run: cp .env.example .env
      - name: docker-compose.yml doğrulama
        run: docker compose -f docker-compose.yml config -q
        env:
          ENCRYPTION_KEY: ci
          SECRET_KEY: ci
      - name: İmajları build et
        run: |
          docker build -t dosyalama-backend ./backend
          docker build -t dosyalama-frontend --build-arg BACKEND_URL=http://backend:8000 ./frontend
