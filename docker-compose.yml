services:
  backend:
    build: ./backend
    ports:
      - "51:8000"
    env_file:
      - .env
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:50}
      - DATA_DIR=/data
      - STORAGE_MODE=${STORAGE_MODE:-smb}
      - MOUNT_PATH=/mnt/smb
      - SMB_MOUNT_ENABLED=${SMB_MOUNT_ENABLED:-false}
      - SMB_MOUNT_HOST=${SMB_MOUNT_HOST:-}
      - SMB_MOUNT_SHARE=${SMB_MOUNT_SHARE:-}
      - SMB_MOUNT_USERNAME=${SMB_MOUNT_USERNAME:-}
      - SMB_MOUNT_PASSWORD=${SMB_MOUNT_PASSWORD:-}
    volumes:
      - app_data:/data
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "50:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app_data:
